name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Vérifier que agents/ est à jour
        run: uv run python tools/build_agents.py constraint_cells.csv population.csv --check
      - name: Tests
        run: uv run python -m unittest discover -s tests -v
